name: Bug report
description: Report behaviour that appears to be incorrect
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and check the project's documentation first.
        Do not include credentials, tokens or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable set of steps or configuration.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant application, operating system and dependency versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Redact secrets, tokens, personal data and private URLs.
      render: text
    validations:
      required: false
