name: Feature request
description: Suggest an improvement or new capability
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and discussions before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or limitation you have encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the outcome you are looking for. Implementation details are welcome but not required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered another approach or workaround?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mock-ups or other information that helps explain the request.
    validations:
      required: false
